<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | School Bus Tracking</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3ff;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:white;width:100%;max-width:410px;padding:32px;border-radius:18px;box-shadow:0 10px 35px #1e3a8a18}
h1{color:#1d4ed8;margin-bottom:8px}p{color:#64748b;line-height:1.5}
input,button{width:100%;padding:13px;margin-top:14px;border-radius:9px;font-size:15px}
input{border:1px solid #cbd5e1}button{border:0;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
a{color:#2563eb;text-decoration:none}.message{margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Create Account</h1>
  <p>Register as a parent to use the bus tracking dashboard.</p>
  <form id="signupForm">
    <input type="text" id="name" placeholder="Full name" required>
    <input type="email" id="email" placeholder="Email address" required>
    <input type="password" id="password" placeholder="Create password (min. 6 characters)" minlength="6" required>
    <button type="submit">Create Account</button>
  </form>
  <div class="message" id="message"></div>
  <p>Already registered? <a href="/login">Login here</a></p>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const message = document.getElementById("message");
  message.textContent = "Creating account...";
  try {
    const response = await fetch("/api/signup", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:document.getElementById("name").value,
        email:document.getElementById("email").value,
        password:document.getElementById("password").value
      })
    });
    const result = await response.json();
    if(response.ok && result.success){
      message.textContent = "Account created successfully. Opening login...";
      setTimeout(() => window.location.href = "/login", 1000);
    } else {
      message.textContent = result.message || "Unable to create account.";
    }
  } catch(error) {
    message.textContent = "Unable to connect. Please try again.";
  }
});
</script>
</body>
</html>
