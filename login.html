<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - School Bus Tracking</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #eef4ff;
        }

        .login-container {

            width: 400px;

            padding: 35px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h1 {

            font-size: 25px;

            margin-bottom: 10px;

            line-height: 1.3;
        }

        h2 {

            margin-bottom: 25px;
        }

        label {

            display: block;

            text-align: left;

            font-weight: bold;

            margin-bottom: 6px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 16px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        #message {

            margin-top: 15px;

            font-weight: bold;
        }

        .signin-link {

            margin-top: 20px;
        }

        .signin-link a {

            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>
        🚌 School Bus<br>
        Tracking System
    </h1>

    <h2>🔐 Login</h2>


    <form onsubmit="login(event)">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>


    <div class="signin-link">

        Don't have an account?

        <a href="/signin">
            Sign In
        </a>

    </div>

</div>


<script>

async function login(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("message");


    message.innerText = "";


    try {

        const response = await fetch(
            "/api/login",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    password: password

                })

            }
        );


        const result =
            await response.json();


        message.innerText =
            result.message;


        if (result.success) {

            message.style.color = "green";


            // Go directly to Dashboard

            setTimeout(function() {

                window.location.href =
                    "/dashboard";

            }, 500);

        }

        else {

            message.style.color = "red";

        }

    }

    catch (error) {

        message.style.color = "red";

        message.innerText =
            "Server connection failed.";

    }

}

</script>


</body>

</html>
