<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | School Bus Tracking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1d4ed8;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to access your School Bus Tracking Dashboard.
        </p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <div id="message" class="message" role="status"></div>

        <p class="signup-link">
            Don't have an account?
            <a href="/signin">Create Account</a>
        </p>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/signin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    message.textContent =
                        result.message || "Login failed. Check your details.";
                    return;
                }

                message.textContent = "Login successful. Opening dashboard...";

                window.location.replace("/dashboard");

            } catch (error) {
                console.error("Login request failed:", error);

                message.textContent =
                    "Unable to contact the server. Check that the website is running and try again.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
